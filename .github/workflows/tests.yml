name: Tests

on:
  push:
    branches: [master]
    # Docs and artwork can't break a test: don't spend minutes on them.
    paths-ignore:
      - "**.md"
      - "images/**"
      - "media/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "images/**"
      - "media/**"
  workflow_dispatch: {}

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  busted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lua 5.1 is compiled from source and busted pulls a handful of rocks:
      # ~30s every run, against ~1s for the tests themselves. Both land in the
      # workspace (.lua/ and .luarocks/), so they're cached whole; the key
      # changes -- and everything is rebuilt -- whenever this file does.
      - name: Restore Lua and busted
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .lua
            .luarocks
          key: lua5.1-busted-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}

      - name: Set up Lua 5.1
        if: steps.cache.outputs.cache-hit != 'true'
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1"
          buildCache: false # the step above caches it, together with busted

      - name: Set up LuaRocks
        if: steps.cache.outputs.cache-hit != 'true'
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Install busted
        if: steps.cache.outputs.cache-hit != 'true'
        run: luarocks install busted

      # What the two setup actions would have set up: PATH, and the rocks
      # tree's module paths.
      - name: Use cached Lua and busted
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "$GITHUB_WORKSPACE/.lua/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.luarocks/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.lua/bin:$GITHUB_WORKSPACE/.luarocks/bin:$PATH"
          echo "LUA_PATH=;;$(luarocks path --lr-path)" >> "$GITHUB_ENV"
          echo "LUA_CPATH=;;$(luarocks path --lr-cpath)" >> "$GITHUB_ENV"

      - name: Run tests
        run: busted -p ".test.lua" .
